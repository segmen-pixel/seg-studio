title: Seg-Studio
tagline: Local GUI for semantic segmentation
description: >-
  Seg-Studio is an open-source, all-in-one image segmentation workbench that runs
  entirely on your own machine. Annotate with SAM-assisted tools, train PyTorch
  models, count objects, and export to ONNX or CoreML — no cloud account required.

url: https://segmen-pixel.github.io
baseurl: /seg-studio
repository: segmen-pixel/seg-studio
lang: en

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links
  - jekyll-optional-front-matter

relative_links:
  enabled: true
  collections: false

optional_front_matter:
  remove_originals: true

defaults:
  - scope:
      path: ""
    values:
      layout: default

exclude:
  - LICENSE
  - NOTICE
  - THIRD_PARTY_NOTICES.md
  - Gemfile
  - Gemfile.lock
