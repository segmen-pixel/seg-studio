title: Seg-Studio
tagline: Local GUI for semantic segmentation
description: >-
  Seg-Studio is an open-source, all-in-one image segmentation workbench that runs
  entirely on your own machine. Annotate with SAM-assisted tools, train PyTorch
  models, count objects, and export to ONNX or CoreML — no cloud account required.

url: https://segmen-pixel.github.io
baseurl: /seg-studio
repository: segmen-pixel/seg-studio
lang: en

# Google Search Console ownership check; jekyll-seo-tag puts it in every page's head.
webmaster_verifications:
  google: "7mid-VLXav8M1EATCUnlqIVN6_8OEfUr7J-bJ9y_73w"

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links
  - jekyll-optional-front-matter

relative_links:
  enabled: true
  collections: false

optional_front_matter:
  remove_originals: true

defaults:
  - scope:
      path: ""
    values:
      layout: default
  # The Japanese pages. The layout reads page.lang for <html lang> and jekyll-seo-tag for og:locale.
  - scope:
      path: "docs/ja"
    values:
      lang: ja
  - scope:
      path: "docs/contributing/screenshots.ja.md"
    values:
      lang: ja
  - scope:
      path: "README.ja.md"
    values:
      lang: ja
      title: "Seg-Studio — 画像を塗り分ける AI を自分の PC で作れるアプリ"
      description: "画像に写った傷・汚れ・部品・細胞などをピクセル単位で見つける AI モデルを、プログラミングなしで作れるアプリです。無料のオープンソース（Apache-2.0）で、すべて手元の PC の中で動きます。"

exclude:
  - LICENSE
  - NOTICE
  - THIRD_PARTY_NOTICES.md
  - Gemfile
  - Gemfile.lock
