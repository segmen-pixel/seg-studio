<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% seo %}
<link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
<style>
:root{
  --bg:#ffffff; --fg:#1b1f23; --muted:#5b6570; --line:#e3e7ea;
  --accent:#00795a; --accent-soft:#e6f4ef; --mark:#b04a00; --code-bg:#f5f7f8;
  --max:960px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14171a; --fg:#e8ecee; --muted:#9aa5ad; --line:#2b3136;
    --accent:#42d3a8; --accent-soft:#16302a; --mark:#f08a4b; --code-bg:#1c2126;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font:16px/1.72 -apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",
       "Hiragino Kaku Gothic ProN","Noto Sans JP",Arial,sans-serif;
}
a{color:var(--accent); text-decoration:none}
a:hover{text-decoration:underline}
.masthead{border-bottom:1px solid var(--line); background:var(--bg);
  position:sticky; top:0; z-index:10; backdrop-filter:saturate(160%) blur(8px)}
.masthead .in{max-width:var(--max); margin:0 auto; padding:14px 22px;
  display:flex; align-items:center; gap:20px; flex-wrap:wrap}
.brand{font-weight:700; font-size:19px; letter-spacing:-.4px; color:var(--fg)}
.brand span{color:var(--mark)}
.nav{display:flex; gap:17px; font-size:14.5px; margin-left:auto; flex-wrap:wrap}
.nav a{color:var(--muted); font-weight:500}
.nav a:hover{color:var(--accent)}
main{max-width:var(--max); margin:0 auto; padding:38px 22px 80px}
h1,h2,h3,h4{line-height:1.3; margin:1.9em 0 .6em; letter-spacing:-.5px}
h1{font-size:2.05em; margin-top:.2em}
h2{font-size:1.5em; padding-bottom:.28em; border-bottom:1px solid var(--line)}
h3{font-size:1.2em}
p,ul,ol,table,blockquote{margin:0 0 1.05em}
ul,ol{padding-left:1.5em}
li+li{margin-top:.25em}
img{max-width:100%; height:auto; border-radius:7px}
code{background:var(--code-bg); padding:.16em .38em; border-radius:4px;
  font:0.88em/1.5 ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace}
pre{background:var(--code-bg); border:1px solid var(--line); border-radius:8px;
  padding:15px 17px; overflow-x:auto}
pre code{background:none; padding:0}
blockquote{border-left:3px solid var(--accent); padding:.1em 0 .1em 1.05em;
  color:var(--muted); margin-left:0}
.tablewrap{overflow-x:auto; margin:0 0 1.05em}
table{border-collapse:collapse; width:100%; font-size:.95em}
th,td{border:1px solid var(--line); padding:8px 12px; text-align:left; vertical-align:top}
th{background:var(--accent-soft); font-weight:600}
hr{border:0; border-top:1px solid var(--line); margin:2.4em 0}
.foot{border-top:1px solid var(--line); margin-top:56px; padding-top:22px;
  font-size:14px; color:var(--muted); display:flex; gap:16px; flex-wrap:wrap}
.foot a{color:var(--muted); text-decoration:underline}
@media (max-width:640px){
  main{padding:26px 17px 60px}
  h1{font-size:1.72em}
  .masthead .in{padding:12px 17px; gap:12px}
}
</style>
</head>
<body>
<header class="masthead"><div class="in">
  <a class="brand" href="{{ '/' | relative_url }}">Seg-Studio<span>.</span></a>
  <nav class="nav">
    <a href="{{ '/docs/first-run-manual' | relative_url }}">First Run</a>
    <a href="{{ '/docs/user-guide' | relative_url }}">User Guide</a>
    <a href="{{ '/docs/handbook' | relative_url }}">Handbook</a>
    <a href="{{ '/docs/troubleshooting' | relative_url }}">Troubleshooting</a>
    <a href="{{ '/ja/' | relative_url }}">日本語</a>
    <a href="https://github.com/{{ site.repository }}">GitHub</a>
  </nav>
</div></header>

<main>
{{ content }}
  <div class="foot">
    <span>Apache-2.0</span>
    <a href="https://github.com/{{ site.repository }}">Source on GitHub</a>
    <a href="https://github.com/{{ site.repository }}/releases/latest">Download</a>
    <a href="https://github.com/{{ site.repository }}/issues">Issues</a>
  </div>
</main>

<script>
// Wrap wide tables so long pages never scroll the page body sideways.
document.querySelectorAll('main table').forEach(function (t) {
  if (t.parentElement.classList.contains('tablewrap')) return;
  var w = document.createElement('div');
  w.className = 'tablewrap';
  t.parentNode.insertBefore(w, t);
  w.appendChild(t);
});
</script>
</body>
</html>
