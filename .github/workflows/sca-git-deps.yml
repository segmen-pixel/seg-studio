# SPDX-License-Identifier: Apache-2.0
# Vendored-copyleft guard for git+URL dependencies.
#
# The PyPI/npm license gates in license-check.yml read a dependency's
# DECLARED license and cannot see inside a git+URL dependency's tree. A repo
# that declares Apache-2.0 at its root can still vendor AGPL/GPL code (e.g.
# mobile-sam bundles an Ultralytics YOLO / AGPL-3.0 copy). This job clones
# each pinned git dep and fails if copyleft would actually ship (i.e. lands
# in the installable package set). See scripts/ci/check_git_dep_licenses.py.
#
# Clones several repos, so it runs only when the dependency pins change
# (not on every push), plus manually and on the half-yearly re-audit cron.

name: SCA git-dep copyleft

on:
  push:
    paths:
      - "apps/**/requirements*.txt"
      - "scripts/build_installer.py"
      - "scripts/ci/check_git_dep_licenses.py"
      - ".github/workflows/sca-git-deps.yml"
  pull_request:
    paths:
      - "apps/**/requirements*.txt"
      - "scripts/build_installer.py"
  schedule:
    # Half-yearly re-audit, aligned with license-check.yml.
    - cron: "0 0 1 1,7 *"
  workflow_dispatch:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Ensure setuptools is available
        run: python -m pip install --quiet "setuptools>=68"

      - name: Scan git dependencies for vendored copyleft
        run: |
          python3 scripts/ci/check_git_dep_licenses.py \
            apps/trainer_api/requirements.txt \
            scripts/build_installer.py
