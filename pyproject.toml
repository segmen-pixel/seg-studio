[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ── Root project (monorepo coordinator) ──────────────────────────
[project]
name = "seg-studio"
version = "0.9.8"
description = "Semantic segmentation toolkit for industrial inspection"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{name = "segmen-pixel"}]
keywords = ["segmentation", "deep-learning", "pytorch", "industrial-inspection", "annotation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

[project.urls]
Homepage = "https://github.com/segmen-pixel/seg-studio"
Repository = "https://github.com/segmen-pixel/seg-studio"
Issues = "https://github.com/segmen-pixel/seg-studio/issues"

# ── segcore: core ML package (pip install -e packages/segcore) ───
# See packages/segcore/pyproject.toml

# ── Dependencies ─────────────────────────────────────────────────
# Runtime dependencies are NOT declared here. Each app owns its own
# uv-compiled lockfile — install from those instead:
#   apps/trainer_api/requirements*.txt  (+ requirements-dev.txt for tests)
#   apps/serving_api/requirements.txt
# See CONTRIBUTING.md ("Dependency policy") for the regeneration flow.

# ── Ruff (linter + formatter) ────────────────────────────────────
[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = ["E501", "E402"]

[tool.ruff.lint.per-file-ignores]
"**/main.py" = ["E402", "F401"]
"**/cli_train.py" = ["E402", "F401"]
"**/__init__.py" = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["segcore", "app"]

# ── Mypy (type checker) ──────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

# ── Pytest ────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = [
    "tests",
    "apps/trainer_api/tests",
    "apps/serving_api/tests",
    "packages/segcore/tests",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
