server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the trainer-api container
    location ~ ^/(api|v2|ws|health|version|startup-status)(/|$) {
        proxy_pass http://trainer-api:8000;
        # $http_host, not $host: $host drops the port. The browser sends
        # `Origin: http://localhost:5173` on every POST, PUT, DELETE and
        # WebSocket handshake, and the trainer's CSRF check compares that
        # with Host including the port, so `Host: localhost` would turn every
        # state change the UI makes into a 403.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        client_max_body_size 200M;
    }

    # SPA fallback: serve index.html for any route not matching a file
    location / {
        try_files $uri $uri/ /index.html;
    }
}
