[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seg-inference-sdk"
version = "0.9.6"
description = "Python SDK for Seg-Studio real-time inference API"
license = "Apache-2.0"
requires-python = ">=3.8"
dependencies = ["requests>=2.25"]

[project.optional-dependencies]
ws = ["websocket-client>=1.0"]
async = ["httpx>=0.24", "websockets>=11"]
all = ["websocket-client>=1.0", "httpx>=0.24", "websockets>=11"]

[tool.hatch.build.targets.wheel]
packages = ["seg_sdk"]
