[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "seg-segcore"
version = "0.9.12"
description = "Segmentation training core — models, datasets, metrics"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
authors = [{name = "segmen-pixel"}]
keywords = ["segmentation", "deep-learning", "pytorch"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dependencies = [
    "torch>=2.2",
    "torchvision>=0.17",
    "numpy>=1.26,<3",
    "pillow>=10.2",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "opencv-python-headless>=4.9",
    "xgboost>=2.0,<4",
    "filelock>=3",
]

[project.urls]
Homepage = "https://github.com/segmen-pixel/seg-studio"
Repository = "https://github.com/segmen-pixel/seg-studio"
Issues = "https://github.com/segmen-pixel/seg-studio/issues"

[project.optional-dependencies]
distill = [
    "sam-2 @ git+https://github.com/facebookresearch/sam2.git@2b90b9f5ceec907a1c18123530e92e794ad901a4",
]

[tool.hatch.metadata]
# The `distill` extra names sam-2 by its pinned commit, as the trainer lockfile
# does: it is not on PyPI. Hatchling refuses a direct reference unless told to
# allow it, and without this any install of the package from its folder
# (`pip install -e packages/segcore`, which the macOS installer runs) stops
# while its metadata is read.
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["segcore"]
